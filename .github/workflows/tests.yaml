name: Tests
on:
- push
- pull_request
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      with:
        persist-credentials: false
    - name: Setup Pixi
      uses: prefix-dev/setup-pixi@d3f436a425481402e6a95a1d1fc10331c708cd9e # v0.10.2
      with:
        activate-environment: true
    - name: Cache prek
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
      with:
        path: ~/.cache/prek
        key: ${{ runner.os }}-prek-${{ hashFiles('**/.pre-commit-config.yaml', '**/pixi.lock') }}
        restore-keys: |
          ${{ runner.os }}-prek-
    - name: Run prek
      run: pixi run prek run --all-files --show-diff-on-failure --color=always
    - name: Python tests
      run: pixi run pytest --color=yes
