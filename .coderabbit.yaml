# yaml-language-server: $schema=https://coderabbit.ai/integrations/schema.v2.json
tone_instructions: Be terse. Minimize emojis and gratuitous markdown formatting.

enable_free_tier: false

reviews:
  request_changes_workflow: true
  high_level_summary: false
  review_status: false
  commit_status: false
  changed_files_summary: false
  sequence_diagrams: false
  estimate_code_review_effort: false
  assess_linked_issues: false
  related_issues: false
  related_prs: false
  suggested_labels: false
  suggested_reviewers: false
  in_progress_fortune: false
  poem: false
  enable_prompt_for_ai_agents: false
  path_instructions:
    - path: '**'
      instructions: >-
        Only comment on material correctness, security, or maintainability issues. Avoid style
        nitpicks.
  finishing_touches:
    docstrings:
      enabled: false
    unit_tests:
      enabled: false
  pre_merge_checks:
    docstrings:
      mode: 'off'
    title:
      mode: 'off'
    description:
      mode: 'off'
    issue_assessment:
      mode: 'off'

chat:
  art: false
  allow_non_org_members: false

issue_enrichment:
  planning:
    enabled: false
    auto_planning:
      enabled: false
