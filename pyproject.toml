[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pixi.workspace]
channels = ["conda-forge"]
platforms = ["linux-64", "osx-64"]

[project]
name = "openskistats"
version = "0.1.0"
description = "OpenSkiStats: Shredding Data Like Powder"
authors = [
    {name = "Daniel Himmelstein"},
    {name = "Trang Le"},
]
readme = "README.md"
license = {file = "LICENSE.md"}
requires-python = "==3.14.*"

[tool.pixi.dependencies]
nodejs = "==24.18.0"
pnpm = "==11.17.0"
quarto = "==1.9.38"

[tool.pixi.tasks.frontend]
# Pixi task names cannot contain spaces, so `command` provides a subcommand-like UI.
# `install` is a pnpm command, while the other choices are package scripts that require `pnpm run`;
# `pnpm build` would invoke pnpm's own lifecycle command.
cmd = "pnpm {% if command == 'install' %}install{% else %}run {{ command }}{% endif %}"
cwd = "website"
args = [
    { arg = "command", choices = ["install", "build", "test", "typecheck"] },
]

[tool.pixi.pypi-dependencies]
openskistats = { path = ".", editable = true }
beautifulsoup4 = "==4.15.0"
folium = "==0.20.0"
jupyter = "==1.1.1"
matplotlib = "==3.11.1"
mizani = "==0.14.4"
networkx = "==3.6.1"
numpy = "==2.5.2"
osmnx = "==2.1.1"
patito = "==0.8.6"
plotly = "==6.9.0"
plotnine = "==0.16.0a11"
polars= "==1.43.2"
pydantic = "==2.13.4"
pvlib= "==0.15.2"
pyarrow = "==25.0.1"
requests = "==2.34.2"
shapely = "==2.1.2"
rich= "==15.0.0"
typer = "==0.27.1"

[tool.pixi.feature.dev.pypi-dependencies]
mypy = "==2.3.0"
prek = "==0.4.13"
pytest = "==9.1.1"
types-PyYAML = "==6.0.12.20260724"
types-shapely = "==2.1.0.20260728"

[tool.pixi.environments]
default = { features = ["dev"], solve-group = "default" }
production = { features = [], solve-group = "default" }

[project.urls]
"Homepage" = "https://openskistats.org"
"Repository" = "https://github.com/dhimmel/openskistats"
"Issues" = "https://github.com/dhimmel/openskistats/issues"

[project.scripts]
openskistats = "openskistats.commands:Commands.command"

[tool.ruff]
target-version = "py314"
line-length = 88

[tool.ruff.lint]
ignore = [
    "E501",  # line-too-long
]
select = [
    "B",  # flake8-bugbear
    "C",  # flake8-comprehensions
    "C90",  # mccabe
    "E",  # pycodestyle errors
    "F",  # pyflakes
    "I",  # isort
    "UP",  # pyupgrade
    "W",  # pycode warnings
]

[tool.mypy]
python_version = "3.14"
strict = true
pretty = true
show_error_context = true

# https://mypy.readthedocs.io/en/stable/config_file.html#using-a-pyproject-toml-file
[[tool.mypy.overrides]]
module = [
    "IPython.*",
    "networkx.*",
    "pandas.*",
    "patito.*",
    "plotnine.*",
    "polars.*",
    "pvlib.*",
]
ignore_missing_imports = true
follow_imports = "skip"
