[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pixi.workspace]
channels = ["conda-forge"]
platforms = ["linux-64", "osx-64"]

[project]
name = "openskistats"
version = "0.1.0"
description = "OpenSkiStats: Shredding Data Like Powder"
authors = [
    {name = "Daniel Himmelstein"},
    {name = "Trang Le"},
]
readme = "README.md"
license = {file = "LICENSE.md"}
requires-python = "==3.14.*"

[tool.pixi.dependencies]
quarto = "==1.9.38"

[tool.pixi.pypi-dependencies]
openskistats = { path = ".", editable = true }
beautifulsoup4 = "==4.15.0"
folium = "==0.20.0"
# https://github.com/machow/reactable-py/issues/29
great-tables = "==0.22.0" 
jupyter = "==1.1.1"
matplotlib = "==3.11.1"
mizani = "==0.14.4"
networkx = "==3.6.1"
numpy = "==2.4.6"
osmnx = "==2.1.1"
patito = "==0.8.6"
plotly = "==6.9.0"
plotnine = "==0.16.0a11"
polars= "==1.43.0"
pvlib= "==0.15.2"
pyarrow = "==24.0.0"
reactable = "==0.1.6"
requests = "==2.34.2"
rich= "==15.0.0"
typer = "==0.27.0"

[tool.pixi.feature.dev.pypi-dependencies]
mypy = "==2.3.0"
prek = "==0.4.11"
pytest = "==9.1.1"
types-PyYAML = "==6.0.12.20260724"

[tool.pixi.environments]
default = { features = ["dev"], solve-group = "default" }
production = { features = [], solve-group = "default" }

[project.urls]
"Homepage" = "https://openskistats.org"
"Repository" = "https://github.com/dhimmel/openskistats"
"Issues" = "https://github.com/dhimmel/openskistats/issues"

[project.scripts]
openskistats = "openskistats.commands:Commands.command"

[tool.ruff]
target-version = "py314"
line-length = 88

[tool.ruff.lint]
ignore = [
    "E501",  # line-too-long
]
select = [
    "B",  # flake8-bugbear
    "C",  # flake8-comprehensions
    "C90",  # mccabe
    "E",  # pycodestyle errors
    "F",  # pyflakes
    "I",  # isort
    "UP",  # pyupgrade
    "W",  # pycode warnings
]

[tool.mypy]
python_version = "3.14"
strict = true
pretty = true
show_error_context = true

# https://mypy.readthedocs.io/en/stable/config_file.html#using-a-pyproject-toml-file
[[tool.mypy.overrides]]
module = [
    "IPython.*",
    "networkx.*",
    "pandas.*",
    "patito.*",
    "plotnine.*",
    "polars.*",
    "pvlib.*",
    "reactable.*",
]
ignore_missing_imports = true
follow_imports = "skip"
